<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Would I Lie To You? — Video Player</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#101827;color:#f5f7fb;font:16px system-ui,Arial,sans-serif}.wrap{max-width:1600px;margin:auto;padding:20px}.layout{display:grid;grid-template-columns:minmax(0,1.9fr) minmax(330px,1fr);gap:20px}.panel{background:#1c283b;border:1px solid #35465d;border-radius:15px;padding:16px;min-width:0}.screen{aspect-ratio:16/9;background:#080b11;border-radius:12px;overflow:hidden}.screen iframe,.screen #player{width:100%;height:100%;border:0}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}button,input,select{font:inherit}button{background:#33455e;color:#fff;border:1px solid #586b86;border-radius:10px;padding:12px 15px;cursor:pointer}button:hover{background:#47617e}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #7dbbff;outline-offset:2px}.controls button{font-weight:650;min-height:52px}.primary{background:#d6252c;border-color:#d6252c;font-weight:700}.primary:hover{background:#b91e26}input:not([type=range]),select{width:100%;padding:12px;background:#101827;color:#fff;border:1px solid #607087;border-radius:10px;min-width:0}.settings{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.settings input[type=range]{flex:1;min-width:110px;accent-color:#e22a31}.settings select{width:100px}.status{min-height:22px;color:#b9c6d7;font-size:14px;margin:14px 0 0}.sidebar-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.sidebar-head h1{font-size:clamp(19px,2vw,25px);margin:0}.count{color:#b9c6d7;font-size:13px;white-space:nowrap}.filters{display:grid;gap:9px;margin:14px 0 0}.list{max-height:min(72vh,830px);overflow-y:auto;display:grid;align-content:start;gap:9px;margin-top:12px;padding-right:3px}.video{display:flex;align-items:center;text-align:left;gap:12px;width:100%;padding:9px;background:#26354a}.video.active{outline:2px solid #ff575e;background:#35415a}.video img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:7px;background:#101827;flex-shrink:0}.video .name{line-height:1.35;font-weight:600;font-size:14px;overflow-wrap:anywhere}.video .tag{display:block;color:#b9c6d7;font-size:12px;margin-top:5px}.footer{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:#b9c6d7}.footer a{color:#9fceff}.empty{color:#b9c6d7;padding:14px}.now{margin:12px 0 0;font-weight:600;line-height:1.35}@media(max-width:900px){.layout{grid-template-columns:1fr}.wrap{padding:12px}.list{max-height:480px}}@media(max-width:440px){.panel{padding:11px}.video img{width:100px}.controls button{flex:1}}
</style>
</head>
<body><main class="wrap"><div class="layout">
<section class="panel" aria-label="Video player"><div class="screen" id="screen"><div id="player"></div></div><p class="now" id="now"></p>
<div class="controls"><button onclick="safe(p=>p.seekTo(Math.max(0,p.getCurrentTime()-10),true))">↶ Back 10s</button><button class="primary" onclick="safe(p=>p.playVideo())">▶ Play</button><button onclick="safe(p=>p.pauseVideo())">Ⅱ Pause</button><button onclick="safe(p=>p.seekTo(p.getCurrentTime()+10,true))">Forward 10s ↷</button><button onclick="nextVideo()">Next video ⏭</button><button onclick="fullscreen()">⛶ Full screen</button></div>
<div class="settings"><label for="volume">Volume</label><input id="volume" type="range" min="0" max="100" value="80" oninput="safe(p=>p.setVolume(+this.value))"><label for="speed">Speed</label><select id="speed" onchange="safe(p=>p.setPlaybackRate(+this.value))"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></div>
<p id="status" class="status" aria-live="polite">Loading player…</p></section>
<aside class="panel" aria-label="Video selection"><div class="sidebar-head"><h1>Would I Lie To You?</h1><span class="count" id="count"></span></div>
<div class="filters"><input id="filter" placeholder="Search videos…" aria-label="Search videos" oninput="renderList()"><select id="category" aria-label="Filter by category" onchange="renderList()"><option value="all">All videos</option><option value="Lee Mack">Lee Mack</option><option value="David Mitchell">David Mitchell</option><option value="Bob Mortimer">Bob Mortimer</option><option value="Other guests">Other guests</option></select></div>
<div class="list" id="list"></div><div class="footer"><span>Selected videos · Not the full channel catalogue</span><a href="https://www.youtube.com/@WILTY_TV/videos" target="_blank" rel="noopener noreferrer">Official channel ↗</a></div></aside>
</div></main>
<script>
// Hand-picked videos. A complete, automatically updated channel listing requires the YouTube Data API.
const videos=[
{id:'QPRDPIrwmL8',title:'Best of Lee Mack — Over the Years!',category:'Lee Mack'},
{id:'SBFDbkzsDSE',title:'10 David Mitchell Meltdowns',category:'David Mitchell'},
{id:'IlnWagMuaU0',title:'Bob Mortimer vs David Mitchell — Best Moments',category:'Bob Mortimer'},
{id:'ycLSz6z71Kc',title:'Bob Mortimer — This Is My…',category:'Bob Mortimer'},
{id:'gKDvl-4sY-0',title:'Sam Campbell — Would I Lie To You?',category:'Other guests'},
{id:'UwJco5gF5UM',title:'Edinburgh Fringe Stars Who Sent WILTY Spiralling',category:'Other guests'}
];
let selected=0,player=null,ready=false;
function status(s){document.getElementById('status').textContent=s}
function safe(fn){if(ready&&player){try{fn(player)}catch(e){status('Player is not ready yet.')}}else status('Please wait for the YouTube player to load.')}
function renderList(){const q=document.getElementById('filter').value.trim().toLowerCase();const cat=document.getElementById('category').value;const list=document.getElementById('list');list.replaceChildren();let count=0;videos.forEach((v,i)=>{if(cat!=='all'&&v.category!==cat)return;if(!v.title.toLowerCase().includes(q))return;count++;const b=document.createElement('button');b.className='video'+(selected===i?' active':'');b.setAttribute('aria-label','Play '+v.title);if(selected===i)b.setAttribute('aria-current','true');const img=document.createElement('img');img.src='https://i.ytimg.com/vi/'+encodeURIComponent(v.id)+'/mqdefault.jpg';img.alt='';img.loading='lazy';const details=document.createElement('span');const name=document.createElement('span');name.className='name';name.textContent=v.title;const tag=document.createElement('span');tag.className='tag';tag.textContent=v.category;details.append(name,tag);b.append(img,details);b.onclick=()=>choose(i);list.appendChild(b)});document.getElementById('count').textContent=count+' videos';if(!count){const p=document.createElement('p');p.className='empty';p.textContent='No matching videos.';list.appendChild(p)}}
function choose(i){selected=i;const v=videos[i];document.getElementById('now').textContent=v.title;renderList();status('Selected: '+v.title);if(ready&&player)player.loadVideoById(v.id)}
function nextVideo(){choose((selected+1)%videos.length)}
function fullscreen(){const el=document.getElementById('screen');if(el.requestFullscreen)el.requestFullscreen();else status('Full screen is not available in this browser.')}
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{height:'100%',width:'100%',videoId:videos[0].id,playerVars:{playsinline:1,rel:0,origin:location.origin},events:{onReady:e=>{ready=true;e.target.setVolume(80);status('Ready. Choose a video or press Play.')},onError:e=>{status('YouTube could not play this video (error '+e.data+'). Choose another video or open it on YouTube.')}}})}
document.getElementById('now').textContent=videos[0].title;renderList();const script=document.createElement('script');script.src='https://www.youtube.com/iframe_api';document.head.appendChild(script);
</script></body></html>
